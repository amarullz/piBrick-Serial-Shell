<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>piBrick Serial Shell</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d12;
      --panel: #101820;
      --line: #263442;
      --text: #d6e2e9;
      --muted: #8194a2;
      --green: #a6e3a1;
      --cyan: #89dceb;
      --red: #f38ba8
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden
    }

    body {
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      display: flex;
      flex-direction: column;
      overflow: hidden
    }

    .topbar {
      order: 4;
      position: relative;
      z-index: 20;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 15px;
      background: #111820;
      border-bottom: 1px solid var(--line);
      font-family: system-ui, sans-serif;
      min-width: 0
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700
    }

    .led {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #657583
    }

    .led.on {
      background: var(--green);
      box-shadow: 0 0 8px #a6e3a155
    }

    .sub {
      font-size: 12px;
      color: var(--muted);
      font-weight: 400
    }

    button,
    select {
      background: #17232d;
      border: 1px solid #354653;
      color: var(--text);
      border-radius: 5px;
      padding: 7px 10px;
      font: inherit
    }

    button {
      cursor: pointer
    }

    button:hover:not(:disabled) {
      border-color: var(--cyan)
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .connect {
      color: var(--green)
    }

    .usbconnect {
      color: var(--cyan)
    }

    .settings {
      order: 3;
      position: relative;
      z-index: 19;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px 14px;
      background: #0d141b;
      border-bottom: 1px solid var(--line);
      font-size: 12px
    }

    .settings label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted)
    }

    select {
      padding: 5px 7px;
      font-size: 12px
    }

    main {
      order: 1;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 8px 10px 0;
      overflow: hidden
    }

    #terminal {
      flex: 1;
      min-height: 0;
      width: 100%;
      padding: 8px 10px
    }

    .xterm {
      height: 100%;
      padding: 0
    }

    .keybar {
      user-select: none;
      order: 2;
      position: relative;
      z-index: 30;
      display: none;
      flex: 0 0 auto;
      align-items: center;
      padding: 7px 9px;
      background: #0b1218;
      border-top: 1px solid var(--line);
      overflow: visible;
      min-width: 0
    }

    .keybar.visible {
      display: flex
    }

    .key-scroll {
      touch-action: pan-x;
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      scrollbar-width: none;
      -ms-overflow-style: none;
      overscroll-behavior-x: contain;
      padding-right: 84px
    }

    .key-scroll::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0
    }

    .key-scroll button {
      touch-action: pan-x;
      flex: 0 0 auto;
      min-width: 38px;
      padding: 4px 6px;
      font-size: 10px
    }

    .key-scroll button.mod.active {
      background: #244638;
      border-color: var(--green);
      color: var(--green)
    }

    .key-scroll button.last-group,
    .key-scroll button:last-child {
      margin-right: 10px;
    }

    .macro-wrap {
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      flex: 0 0 auto;
      background: #0b1218;
      padding-left: 7px
    }

    #macroToggle {
      min-width: 76px;
      color: var(--cyan);
      font-size: 10px
    }

    #macroToggle[aria-expanded="true"] {
      border-color: var(--cyan);
      background: #20323d
    }

    .macro-menu {
      touch-action: pan-y;
      position: absolute;
      right: 0;
      bottom: calc(100% + 9px);
      width: min(320px, calc(100vw - 18px));
      max-height: min(calc(100vh - 160px), 560px);
      overflow-y: auto;
      overscroll-behavior: contain;
      display: none;
      padding: 6px;
      background: #111b24;
      border: 1px solid #354653;
      border-radius: 9px;
      box-shadow: 0 12px 32px #0009;
      white-space: normal
    }

    .macro-menu.open {
      display: block
    }

    .macro-menu button {
      touch-action: pan-y;
      display: block;
      width: 100%;
      min-width: 0;
      text-align: left;
      border: 0;
      background: transparent;
      border-radius: 5px;
      padding: 9px 10px;
      font-size: 13px;
      line-height: 1.35;
      color: var(--text)
    }

    .macro-menu button:hover:not(:disabled) {
      background: #20323d;
      border-color: transparent
    }

    .macro-menu .macro-separator {
      height: 1px;
      background: var(--line);
      margin: 5px 3px;
      pointer-events: none
    }

    .macro-menu .macro-heading {
      padding: 7px 10px 4px;
      color: var(--muted);
      font: 600 11px/1.4 system-ui, sans-serif;
      text-transform: uppercase;
      letter-spacing: .06em;
      pointer-events: none;
    }

    .macro-menu button:disabled {
      opacity: .45
    }

    @media(max-width:620px) {
      .topbar {
        gap: 6px;
        padding: 7px 8px;
        align-items: center
      }

      .brand {
        gap: 6px;
        min-width: 0;
        white-space: nowrap;
        font-size: 12px
      }

      .topbar>div:last-child {
        display: flex !important;
        flex-wrap: nowrap !important;
        gap: 4px !important;
        justify-content: flex-end;
        flex: 0 0 auto
      }

      .topbar button {
        padding: 6px 7px;
        font-size: 12px;
        white-space: nowrap;
        line-height: 1.2
      }

      #clear {
        font-size: 0;
        min-width: 32px
      }

      #clear:after {
        content: "🧹";
        font-size: 15px
      }

      #usbConnect {
        font-size: 0
      }

      #usbConnect:after {
        content: "🔌 USB";
        font-size: 12px
      }

      #usbConnect.is-disconnect:after {
        content: "⏏ USB"
      }

      #connect {
        font-size: 0
      }

      #connect:after {
        content: "↔ Serial";
        font-size: 12px
      }

      #connect.is-disconnect:after {
        content: "⏏ Serial"
      }

      .settings {
        position: relative;
        gap: 6px;
        padding: 6px 8px
      }

      .settings label {
        flex: 0 1 auto;
        font-size: 11px;
        gap: 4px
      }

      .settings select {
        max-width: 100%;
        padding: 4px 5px;
        font-size: 11px
      }

      .topbar .sub {
        display: none
      }

      main {
        padding: 2px 2px 0
      }

      #terminal {
        padding: 4px
      }

      .keybar {
        padding: 5px
      }

      .key-scroll {
        gap: 4px;
        padding-right: 76px
      }

      .key-scroll button {
        min-width: 34px;
        padding: 6px 7px
      }

      .macro-wrap {
        right: 5px;
        padding-left: 5px
      }

      #macroToggle {
        min-width: 66px
      }
    }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
</head>

<body>
  <div class="topbar">
    <div class="brand"><span id="led" class="led"></span>
      <div>piBrick <span style="color:var(--cyan)">serial-shell</span>
        <div class="sub" id="status">Disconnected · click Connect to choose a serial port</div>
      </div>
    </div>
    <div style="display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end"><button id="clear"
        title="Clear terminal">Clear</button><button id="fullscreenBtn" title="Enter fullscreen" style="display:none">⛶
        Fullscreen</button><button id="disconnectBtn" title="Disconnect current connection"
        style="display:none">❌</button><button id="usbConnect" class="usbconnect" title="Connect using USB (CH340)">🔌
        USB</button><button id="connect" class="connect" title="Connect using Web Serial">🛟 Serial</button></div>
  </div>
  <div class="settings" id="settings">
    <label>Baud <select id="baud">
        <option>9600</option>
        <option>19200</option>
        <option>38400</option>
        <option>57600</option>
        <option selected>115200</option>
        <option>230400</option>
      </select></label>
    <label><select id="bits">
        <option selected value="8">8 Bits</option>
        <option value="7">7 Bits</option>
      </select></label>
    <label><select id="parity">
        <option value="none" selected>none</option>
        <option value="even">even</option>
        <option value="odd">odd</option>
      </select></label>
    <label><select id="stop">
        <option selected value="1">1 Stop</option>
        <option value="2">2 Stop</option>
      </select></label>
  </div>
  <div class="keybar" id="keybar" aria-label="Terminal keys">
    <div class="key-scroll" id="keyScroll">
      <button class="mod" id="ctrlKey" title="Apply Ctrl to the next key">Ctrl</button>
      <button class="mod" id="altKey" title="Prefix the next key with Escape">Alt</button>
      <button data-key="tab">Tab</button>
      <button data-key="esc" class="last-group">Esc</button>

      <button data-key="slash">/</button>
      <button data-key="tilde" class="last-group">~</button>

      <button data-key="up" aria-label="Arrow up">↑</button>
      <button data-key="down" aria-label="Arrow down">↓</button>
      <button data-key="left" aria-label="Arrow left">←</button>
      <button data-key="right" aria-label="Arrow right" class="last-group">→</button>

      <button data-key="delete" class="last-group">Del</button>

      <button data-key="home">Home</button>
      <button data-key="end">End</button>
      <button data-key="pageup">PgUp</button>
      <button data-key="pagedown" class="last-group">PgDn</button>

      <button data-key="f1">F1</button>
      <button data-key="f2">F2</button>
      <button data-key="f3">F3</button>
      <button data-key="f4">F4</button>
      <button data-key="f5">F5</button>
      <button data-key="f6">F6</button>
      <button data-key="f7">F7</button>
      <button data-key="f8">F8</button>
      <button data-key="f9">F9</button>
      <button data-key="f10">F10</button>
      <button data-key="f11">F11</button>
      <button data-key="f12">F12</button>
    </div>
    <div class="macro-wrap" id="macroWrap">
      <button id="macroToggle" aria-haspopup="true" aria-expanded="false" title="Open command and shortcut menu">Macro
        ▴</button>
      <div class="macro-menu" id="macroMenu" role="menu" aria-label="Terminal macros">
        <div class="macro-heading">Raspberry related</div>
        <button type="button" data-macro-command="sudo nano /boot/firmware/config.txt">Edit config.txt</button>
        <button type="button" data-macro-command="sudo nano /boot/firmware/cmdline.txt">Edit cmdline.txt</button>
        <button type="button" data-macro-command="sudo raspi-config">raspi-config</button>
        <div class="macro-separator" role="separator"></div>
        <div class="macro-heading">Terminal</div>
        <button type="button" data-macro="terminal-size">Update Terminal Size</button>
        <div class="macro-separator" role="separator"></div>
        <button type="button" data-macro-key="ctrl-d">Ctrl-D</button>
        <button type="button" data-macro-key="ctrl-x">Ctrl-X</button>
        <button type="button" data-macro-key="ctrl-c">Ctrl-C</button>
        <button type="button" data-macro-key="ctrl-z">Ctrl-Z</button>
      </div>
    </div>
  </div>
  <main>
    <div id="terminal" aria-label="VT100 serial terminal"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.js"></script>
  <script>
    (() => {
      const $ = id => document.getElementById(id);

      // Let a vertical mouse wheel scroll the virtual-key strip horizontally.
      const keyScroll = $('keyScroll');
      keyScroll.addEventListener('wheel', event => {
        const delta = Math.abs(event.deltaX) > Math.abs(event.deltaY)
          ? event.deltaX
          : event.deltaY;
        if (delta !== 0 && keyScroll.scrollWidth > keyScroll.clientWidth) {
          event.preventDefault();
          keyScroll.scrollLeft += delta;
        }
      }, { passive: false });
      // Keep shortcut buttons from taking focus away from xterm, which hides the mobile IME.
      // CSS touch-action (pan-x / pan-y) still allows native scrolling from the button surfaces.
      $('keybar').addEventListener('pointerdown', e => {
        if (e.target.closest('button')) e.preventDefault();
      });
      $('macroMenu').addEventListener('pointerdown', e => {
        if (e.target.closest('button')) e.preventDefault();
      });
      const term = new Terminal({
        cursorBlink: true,
        convertEol: false,
        scrollback: 5000,
        fontFamily: 'ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace',
        fontSize: 13,
        theme: {
          background: '#090d12', foreground: '#d6e2e9', cursor: '#a6e3a1',
          cursorAccent: '#090d12', selectionBackground: '#365064',
          black: '#151b22', red: '#f38ba8', green: '#a6e3a1', yellow: '#f9e2af',
          blue: '#89b4fa', magenta: '#cba6f7', cyan: '#89dceb', white: '#d6e2e9',
          brightBlack: '#657583', brightRed: '#f38ba8', brightGreen: '#a6e3a1',
          brightYellow: '#f9e2af', brightBlue: '#89b4fa', brightMagenta: '#cba6f7',
          brightCyan: '#89dceb', brightWhite: '#ffffff'
        }
      });

      const fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      if (typeof WebLinksAddon !== 'undefined' && WebLinksAddon.WebLinksAddon) {
        term.loadAddon(new WebLinksAddon.WebLinksAddon((event, uri) => {
          window.open(uri, '_blank', 'noopener,noreferrer');
        }));
      }
      term.open($('terminal'));

      // Disable browser-side spelling and text correction on xterm's actual input.
      // Use the textarea's bubbling focusin event to reapply these attributes.
      function configureTerminalInput() {
        const textarea = $('terminal').querySelector('.xterm-helper-textarea');
        if (!textarea) return;
        textarea.setAttribute('spellcheck', 'false');
        textarea.setAttribute('autocorrect', 'off');
        textarea.setAttribute('autocapitalize', 'off');
        textarea.setAttribute('autocomplete', 'off');
        textarea.setAttribute('data-gramm', 'false');
        textarea.setAttribute('data-gramm_editor', 'false');
        textarea.spellcheck = false;
      }
      configureTerminalInput();
      $('terminal').addEventListener('focusin', configureTerminalInput);
      const terminalInputObserver = new MutationObserver(configureTerminalInput);
      terminalInputObserver.observe($('terminal'), { childList: true, subtree: true });

      $('terminal').addEventListener('pointerdown', () => term.focus());
      function fit() { try { fitAddon.fit() } catch (_) { } }
      requestAnimationFrame(fit);
      window.addEventListener('resize', () => requestAnimationFrame(fit));
      if ('ResizeObserver' in window) {
        const terminalResizeObserver = new ResizeObserver(() => requestAnimationFrame(fit));
        terminalResizeObserver.observe($('terminal'));
      }
      // Keep the terminal and bottom controls inside the visible area when Android's IME opens.
      function syncViewport() {
        const h = window.visualViewport ? window.visualViewport.height : (window.innerHeight || document.documentElement.clientHeight);
        document.body.style.height = Math.max(180, h) + 'px';
        requestAnimationFrame(fit);
      }
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncViewport);
        window.visualViewport.addEventListener('scroll', syncViewport);
      }
      window.addEventListener('orientationchange', syncViewport);
      syncViewport();

      let port = null, reader = null, writer = null, keepReading = false, readTask = null;
      let usbDevice = null, usbInEndpoint = null, usbOutEndpoint = null, usbDataInterface = null, usbControlInterface = null, usbKeepReading = false, usbReadTask = null;
      let ctrlPending = false, altPending = false;
      function setConnected(on, msg) {
        $('led').classList.toggle('on', on);
        $('status').textContent = msg;
        $('connect').textContent = on ? (port ? 'Disconnect' : '🛟 Serial') : '🛟 Serial';
        $('usbConnect').textContent = on ? (usbDevice ? 'Disconnect USB' : '🔌 USB') : '🔌 USB';
        $('connect').classList.toggle('is-disconnect', on && !!port);
        $('usbConnect').classList.toggle('is-disconnect', on && !!usbDevice);
        // Once connected, hide both connection choices and show the dedicated
        // Disconnect and Fullscreen controls.
        $('connect').style.display = on ? 'none' : '';
        $('usbConnect').style.display = on ? 'none' : '';
        $('disconnectBtn').style.display = on ? '' : 'none';
        $('fullscreenBtn').style.display = on ? '' : 'none';
        $('settings').style.display = on ? 'none' : 'flex';
        $('keybar').classList.toggle('visible', on);
        $('keybar').querySelectorAll('button').forEach(b => b.disabled = !on);
        if (!on) { ctrlPending = false; altPending = false; updateModifiers() }
        fit();
        if (on) term.focus();
      }
      async function connect() {
        if (port) { await disconnect(); return }
        if (usbDevice) { await disconnectUsb(); return }
        if (!('serial' in navigator)) { term.write('\r\n\x1b[31mWeb Serial is not supported here. Use desktop Chrome or Edge over HTTPS or localhost.\x1b[0m\r\n'); return }
        try {
          port = await navigator.serial.requestPort();
          await port.open({ baudRate: Number($('baud').value), dataBits: Number($('bits').value), parity: $('parity').value, stopBits: Number($('stop').value), bufferSize: 4096 });
          writer = port.writable.getWriter(); keepReading = true;
          setConnected(true, 'Connected · ' + $('baud').value + ' baud');
          term.write('\r\n\x1b[90m[serial connected]\x1b[0m\r\n');
          readTask = readLoop();
        } catch (e) {
          term.write('\r\n\x1b[31m[connect error: ' + String(e.message || e).replace(/[\x00-\x1f\x7f]/g, ' ') + ']\x1b[0m\r\n');
          try { if (port) await port.close() } catch (_) { }
          port = null; writer = null; setConnected(false, 'Disconnected');
        }
      }
      async function readLoop() {
        try {
          while (port && port.readable && keepReading) {
            reader = port.readable.getReader();
            try {
              while (keepReading) {
                const { value, done } = await reader.read();
                if (done) break;
                if (value && value.length) {
                  // Pass raw bytes to xterm.js so its parser handles UTF-8 and ANSI/VT sequences.
                  term.write(value, () => term.scrollToBottom());
                }
              }
            } finally { try { reader.releaseLock() } catch (_) { } reader = null }
          }
        } catch (e) { if (keepReading) term.write('\r\n\x1b[31m[read error: ' + String(e.message || e) + ' ]\x1b[0m\r\n') }
      }
      async function sendBytes(data) {
        if (!writer) return;
        try { await writer.write(typeof data === 'string' ? new TextEncoder().encode(data) : data) }
        catch (e) { term.write('\r\n\x1b[31m[write error: ' + String(e.message || e) + ' ]\x1b[0m\r\n') }
      }
      // xterm handles VT/ANSI rendering, cursor addressing, alternate screen, keyboard
      // sequences, selection, scrollback, and common terminal modes.
      term.onData(data => {
        if (!writer && !usbDevice) return;
        if (ctrlPending) {
          ctrlPending = false; updateModifiers();
          const ch = data.length === 1 ? data.toUpperCase() : '';
          if (ch >= 'A' && ch <= 'Z') data = String.fromCharCode(ch.charCodeAt(0) - 64);
          else if (ch === '[') data = '\x1b';
          else if (ch === '\\') data = '\x1c';
          else if (ch === ']') data = '\x1d';
          else if (ch === '^') data = '\x1e';
          else if (ch === '_') data = '\x1f';
        } else if (altPending) {
          altPending = false; updateModifiers(); data = '\x1b' + data;
        }
        if (writer) sendBytes(data); else sendUsbBytes(data);
      });
      async function disconnect() {
        keepReading = false;
        try { if (reader) await reader.cancel() } catch (_) { }
        try { if (writer) { writer.releaseLock(); writer = null } } catch (_) { }
        try { if (port) await port.close() } catch (e) { term.write('\r\n\x1b[90m[close note: ' + e.message + ']\x1b[0m\r\n') }
        port = null; setConnected(false, 'Disconnected'); term.write('\r\n\x1b[90m[serial disconnected]\x1b[0m\r\n');
      }
      let usbWorker = null;
      async function connectUsb() {
        if (usbDevice) { await disconnectUsb(); return }
        if (!('usb' in navigator)) {
          term.writeln('\x1b[31mWebUSB is not available in this browser. Try Chrome on Android, or use Serial USB Terminal.\x1b[0m'); return;
        }
        if (typeof Worker === 'undefined' || typeof Blob === 'undefined' || typeof URL.createObjectURL !== 'function') {
          term.writeln('\x1b[31mWeb Workers are not available in this browser.\x1b[0m'); return;
        }
        try {
          // The chooser must run on the window thread inside the USB button's user gesture.
          // The worker then obtains the already-authorized CH340 via its own navigator.usb.
          const device = await navigator.usb.requestDevice({ filters: [{ vendorId: 0x1A86, productId: 0x7523 }] });
          usbDevice = device;
          const workerSource = `
       let dev=null, inEp=null, outEp=null, dataInterface=null, running=false;
       // RX buffers are transferred directly to the main thread. Do not copy,
       // batch, decode, or wrap the received bytes in a typed array in the worker.
       const sendError = e => postMessage({type:'error', message:String(e && (e.message||e) || e)});
       async function out(request,value,index=0){
         const r=await dev.controlTransferOut({requestType:'vendor',recipient:'device',request,value,index});
         if(r.status!=='ok')throw new Error('CH340 control request 0x'+request.toString(16)+' failed ('+r.status+')');
       }
       async function inp(request,value,index,length){
         const r=await dev.controlTransferIn({requestType:'vendor',recipient:'device',request,value,index},length);
